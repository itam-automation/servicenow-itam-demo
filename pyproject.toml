[project]
name = "servicenow-itam-demo"
version = "0.1.0"
description = "IT Asset Management on a ServiceNow developer instance: test data, Import Sets, IRE, data quality"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
